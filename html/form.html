<!DOCTYPE html>
<html lang="es">

    <!- Menú de Navegación ->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="menuNavegacion">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item">

                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!- Contenedor Principal --
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <section class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <h2 class="h4 text-primary fw-bold mb-4 border-bottom pb-2">
                        <i class="fa-solid fa-pen-to-square me-2"></i>Formulario de Registro
                    </h2>

                    <form action="procesar_formulario.php" method="post">
                        < Campo: Nombre --
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold text-secondary">Nombre del Producto:</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Procesador Intel i5" required>
                        </div>

                        <! Campo: Descripción ->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-semibold text-secondary">Descripción:</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Ingresa los detalles del producto..." required></textarea>
                        </div>

                        <!- Fila de 2 columnas para Precio y Cantidad --
                        <div class="row g-3 mb-4">
                            <div class="col-12 col-sm-6">
                                <label for="precio" class="form-label fw-semibold text-secondary">Precio ($):</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="precio" name="precio" step="0.01" min="0" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label for="cantidad" class="form-label fw-semibold text-secondary">Cantidad en Stock:</label>
                                <input type="number" class="form-control" id="cantidad" name="cantidad" min="0" placeholder="0" required>
                            </div>
                        </div>

                        <!-Botones de Acción --
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill fw-semibold">
                                <i class="fa-solid fa-floppy-disk me-1"></i>Registrar Producto
                            </button>
                            <button type="reset" class="btn btn-outline-secondary">
                                <i class="fa-solid fa-rotate-left me-1"></i>Limpiar
                            </button>
                        </div>
                    </form>
                </section>

            </div>
        </div>
    </main>
